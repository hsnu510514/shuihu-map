<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>水滸輿圖 · 正在返回</title>
    <script>
      // GitHub Pages SPA fallback for a project site served at /<repo>/
      // Keep the first path segment (the repository name); change to 0 for a root site.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body>
    <p>正在返回水滸輿圖……若未自動跳轉，請回到<a href="./">首頁</a>。</p>
  </body>
</html>
